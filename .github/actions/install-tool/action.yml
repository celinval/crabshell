name: Install a CLI tool
description: >
  Install a crate's binaries at the version pinned in .github/cli-tools/Cargo.toml,
  building them with `cargo install --locked` only when they aren't cached.

inputs:
  tool:
    description: The crate to install, as listed in .github/cli-tools/Cargo.toml.
    required: true

runs:
  using: composite
  steps:
    - id: version
      shell: bash
      env:
        TOOL: ${{ inputs.tool }}
        MANIFEST: ${{ github.action_path }}/../../cli-tools/Cargo.toml
      run: |
        version=$(sed -nE "s/^${TOOL} = \"=([0-9]+\.[0-9]+\.[0-9]+)\"$/\1/p" "$MANIFEST")
        if [ -z "$version" ]; then
          echo "::error::$TOOL needs an exact \`$TOOL = \"=x.y.z\"\` line in $MANIFEST"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "root=$HOME/.cargo-tools/$TOOL" >> "$GITHUB_OUTPUT"

    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.version.outputs.root }}
        key: ${{ inputs.tool }}-${{ steps.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TOOL: ${{ inputs.tool }}
        VERSION: ${{ steps.version.outputs.version }}
        ROOT: ${{ steps.version.outputs.root }}
      run: |
        rustup toolchain install stable --profile minimal
        cargo +stable install --locked --root "$ROOT" "$TOOL@$VERSION"

    - shell: bash
      env:
        ROOT: ${{ steps.version.outputs.root }}
      run: echo "$ROOT/bin" >> "$GITHUB_PATH"
