version: 2
updates:
  # Root workspace only. The crabshell/fixtures workspaces pin their lockfiles on purpose.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        update-types: [minor, patch]

  # The CLI tools CI installs; see .github/cli-tools/Cargo.toml.
  - package-ecosystem: cargo
    directory: /.github/cli-tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Keeps the SHA-pinned actions in workflows and local actions up to date.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
