[workspace]
resolver = "3"
members = ["crabshell", "probe"]
exclude = ["e2e-tests"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/celinval/crabshell"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = "warn"
