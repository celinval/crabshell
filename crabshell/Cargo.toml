[package]
name = "crabshell"
version = "0.0.0"
description = "A sandbox for Cargo build scripts."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "crabshell"
path = "src/lib.rs"

[[bin]]
name = "crabshell"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
