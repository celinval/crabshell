[package]
name = "crabshell"
version = "0.0.0"
description = "A sandbox for Cargo build scripts."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Honors CRABSHELL_REQUESTS, a file of requests standing in for crates' own
# declarations. For the e2e-tests matrix only.
test-requests = []

[lib]
name = "crabshell"
path = "src/lib.rs"

[[bin]]
name = "crabshell"
path = "src/main.rs"

[dependencies]
glob = "0.3"
schemars = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
rustix = { version = "1.1.5", features = ["process", "thread"] }

[dev-dependencies]
jsonschema = { version = "0.60.2", default-features = false }
serde_json = "1.0.154"
tempfile = "3"

[lints]
workspace = true
