# Run every build script through crabshell. Requires
# `-Zhost-config -Ztarget-applies-to-host`: nightly Cargo, or RUSTC_BOOTSTRAP=1.
target-applies-to-host = false

[host]
runner = ["../../../target/debug/crabshell"]

[env]
CRABSHELL_CONFIG = { value = "sandbox.toml", relative = true }

# drm-sys takes its include dir from this variable, or else from pkg-config,
# and not every distro ships a `libdrm.pc`. All it parses are the kernel's
# uapi drm headers, which come with the kernel headers a C toolchain needs.
LIBDRM_INCLUDE_PATH = "/usr/include/drm"
# Where distros that ship libdrm's own copy of those headers keep them, for
# hosts without the uapi ones. clang ignores an include dir that's missing.
BINDGEN_EXTRA_CLANG_ARGS = "-I/usr/include/libdrm"
