#:schema ../../schema/sandbox.schema.json
# A loose consumer policy: the category's grants and any environment variable.
include = ["grants.toml"]

[external]
# OUT_DIR is write-only; compile probes and cc-rs read back what they write.
# The drm headers are consumer knowledge, like the env var naming them.
read = { inherit = true, value = [":out_dir", ":libdrm_include_path"] }
grants = ["rustc", "cc", "bindgen", "pkg-config"]
env = ["*"]
