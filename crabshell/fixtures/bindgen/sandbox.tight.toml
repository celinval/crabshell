#:schema ../../schema/sandbox.schema.json
# The tightest consumer policy that works without crate requests: the union of
# requests.toml, granted to every external crate. Two kinds of request are
# left out, and no build script here takes the path that would use them: the
# writes into a crate's own sources, which live in a read-only registry, and
# the programs no grant covers (`pg_config`, `rustfmt`), which crabshell
# resolves on PATH and neither of which is installed.
include = ["grants.toml"]

[external]
# OUT_DIR is write-only; compile probes and cc-rs read back what they write.
# The drm headers are consumer knowledge, like the env var naming them.
read = { inherit = true, value = [":out_dir", ":libdrm_include_path"] }
grants = ["rustc", "cc", "bindgen", "pkg-config"]
# The default grant already covers TARGET, HOST, CARGO_CFG_* and
# CARGO_FEATURE_*, so only the rest is added.
env = { inherit = true, value = [
    "MAKE_GENERIC_BINDINGS", "FDB_CLIENT_LIB_PATH", "LIBDRM_INCLUDE_PATH",
    "IOX2_CUSTOM_PLATFORM_CONFIGURATION_PATH", "IOX2_CUSTOM_POSIX_PLATFORM_PATH",
    "PQ_LIB_DIR", "PQ_LIB_DIR_*", "PQ_LIB_STATIC", "PQ_LIB_STATIC_*", "PG_CONFIG_*",
    "SYSROOT", "TARGET_SYSROOT", "SYSROOT_*", "SELINUX_*", "TARGET_SELINUX_*", "LIBRARY_PATH",
    "LIBC_BUILD_VERBOSE", "LIBC_CI", "RUST_LIBC_UNSTABLE_*", "WIND_RELEASE_ID",
    "CARGO_PKG_VERSION", "CARGO_PKG_VERSION_*", "CARGO_MANIFEST_LINKS", "CARGO_MANIFEST_DIR",
    "RUSTC_BOOTSTRAP", "RUSTC_STAGE", "DOCS_RS",
] }
