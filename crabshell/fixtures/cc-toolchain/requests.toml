# What each crate's build script would request, precisely, from the vendor's
# point of view: only what its own code uses, with no knowledge of the host.
# Test-only: crabshell reads it through CRABSHELL_REQUESTS (feature
# `test-requests`) in place of the crates' `[package.metadata.crabshell]`.
# Every build script in the fixture is listed; a crate that reads its own
# files requests exactly those, since the crate root is otherwise narrowed
# away. The compilers', CMake's and make's own knobs come with the `cc`,
# `cxx`, `cmake` and `autotools` grants. cc-rs, CMake and configure scripts
# open their files in OUT_DIR read-write.

[package.aegis]
# Compiles the vendored libaegis. It runs `clang --version` and compiles with
# clang when that works, falling back to the default compiler otherwise.
read = [":manifest_dir/src/c", ":out_dir"]
requests = ["cc", "clang"]
env = [
    "CARGO_CFG_TARGET_ARCH", "CARGO_CFG_TARGET_ENV", "CARGO_CFG_TARGET_OS",
    "CARGO_FEATURE_FORCE_WASM_RELAXED_SIMD", "CARGO_FEATURE_FORCE_WASM_STRICT_SIMD",
    "CARGO_FEATURE_PURE_RUST", "CARGO_FEATURE_RAF_CORE", "CARGO_MANIFEST_DIR", "HOST", "TARGET",
]

[package.alloca]
# Compiles one C file, after probing the compiler for a hardening flag.
read = [":manifest_dir/alloca.c", ":out_dir"]
requests = ["cc"]

[package.blake2b-rs]
# Compiles either the SSE or the portable BLAKE2b, by target feature.
read = [":manifest_dir/BLAKE2", ":out_dir"]
requests = ["cc"]
env = ["CARGO_CFG_TARGET_FEATURE"]

[package.blake3]
# Compiles its assembly, after probing the compiler for AVX-512 flags.
read = [":manifest_dir/c", ":out_dir"]
requests = ["cc"]
env = [
    "BLAKE3_CI", "CARGO_CFG_TARGET_ARCH", "CARGO_CFG_TARGET_ENDIAN", "CARGO_CFG_TARGET_ENV",
    "CARGO_CFG_TARGET_OS", "CARGO_CFG_TARGET_VENDOR", "CARGO_FEATURE_NEON",
    "CARGO_FEATURE_NO_NEON", "CARGO_FEATURE_PREFER_INTRINSICS", "CARGO_FEATURE_PURE",
    "CARGO_FEATURE_WASM32_SIMD", "HOST", "TARGET",
]

[package.blst]
# Compiles its C and assembly.
read = [":manifest_dir/blst", ":out_dir"]
requests = ["cc"]
env = [
    "BLST_TEST_NO_STD", "CARGO_CFG_TARGET_ARCH", "CARGO_CFG_TARGET_ENV",
    "CARGO_CFG_TARGET_FAMILY", "CARGO_CFG_TARGET_FEATURE", "CARGO_CFG_TARGET_OS",
    "CARGO_CFG_TARGET_POINTER_WIDTH", "CARGO_ENCODED_RUSTFLAGS", "CARGO_FEATURE_SERDE_SECRET",
    "CARGO_MANIFEST_DIR",
]

[package.brotli-sys]
# Compiles the vendored brotli. When the vendored sources hold no `.git`, it
# first runs `git submodule update --init` and ignores whether that worked.
read = [":manifest_dir/brotli", ":out_dir"]
requests = ["cc", "git"]

[package.bzip2-sys]
# Compiles the vendored bzip2 and copies its header. Without the `static`
# feature it first looks for a system bzip2 through pkg-config.
read = [":manifest_dir/bzip2-1.0.8", ":out_dir"]
requests = ["cc", "pkg-config"]
env = ["TARGET"]

[package.cdivsufsort]
# Compiles the vendored libdivsufsort.
read = [":manifest_dir/c-sources", ":out_dir"]
requests = ["cc"]
env = ["CARGO_FEATURE_CROSSCHECK", "PROFILE"]

[package.cee-scape]
# Compiles its setjmp shims, and panics unless a feature selects one.
read = [":manifest_dir/src", ":out_dir"]
requests = ["cc"]
env = ["CARGO_FEATURE_TEST_C_INTEGRATION", "CARGO_FEATURE_USE_C_TO_INTERFACE_WITH_SETJMP"]

[package.clear_on_drop]
# Compiles its one C file.
read = [":manifest_dir/src/hide.c", ":out_dir"]
requests = ["cc"]

[package.cxx]
# Compiles its C++ runtime. It checks `links` against its major version.
read = [":manifest_dir/src/cxx.cc", ":manifest_dir/include", ":out_dir"]
requests = ["rustc", "cc", "cxx"]
env = ["CARGO_MANIFEST_DIR", "CARGO_MANIFEST_LINKS", "CARGO_PKG_VERSION_MAJOR"]

[package.esaxx-rs]
# Compiles its C++.
read = [":manifest_dir/src", ":out_dir"]
requests = ["cc", "cxx"]

[package.errno-dragonfly]
