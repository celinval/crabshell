# Depends on crates whose build scripts (transitively) only read Cargo's
# environment and their own source, and write `OUT_DIR`.
[workspace]

[package]
name = "cfg-only"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
atomic-polyfill = "1"
blas-src = "0.14"
cortex-m-semihosting = "0.6"
crossbeam-epoch = "0.9"
crossbeam-utils = "0.8"
current_platform = "0.2"
dashu-int = "0.6"
decancer = "4"
embassy-time-driver = "0.2"
iceoryx2-pal-configuration = "0.10"
# ICU4X's data crates, one per component: the same build script in both the
# 1.x and the 2.x generation.
icu_calendar_data = "2"
icu_casemap_data = "2"
icu_collator_data = "2"
icu_datetime_data = "2"
icu_decimal_data = "2"
icu_experimental_data = "0.6"
icu_list_data = "2"
icu_locale_data = "2"
icu_locid_transform_data = "1.5"
icu_plurals_data = "2"
icu_properties_data = "2"
icu_time_data = "2"
icu_timezone_data = "1.5"
lalrpop-util = "0.23"
nextest-workspace-hack = "0.1"
# objc2 refuses non-Apple targets unless a GNUstep runtime is selected.
objc2 = { version = "0.6", features = ["gnustep-1-7"] }
rayon-core = "1"
rb-sys-env = "0.2"
scratch = "1"
scuffle-workspace-hack = "0.1"
# Its default `serde` feature pulls serde, whose build script runs rustc.
syscalls = { version = "0.8", default-features = false }
tiny-keccak = { version = "2", features = ["sha3"] }
tree-sitter-language = "0.1"
valuable = "0.1"
# Their scripts read nothing: a deprecation warning, and layout assertions.
rio_api = "0.8"
smallbox = "0.8"
