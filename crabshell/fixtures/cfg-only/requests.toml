# What each crate's build script would request, precisely, from the vendor's
# point of view: only what its own code uses, with no knowledge of the host.
# Test-only: crabshell reads it through CRABSHELL_REQUESTS (feature
# `test-requests`) in place of the crates' `[package.metadata.crabshell]`.
# Every build script in the fixture is listed; an empty table requests
# nothing beyond the floor.

[package.crossbeam-utils]
env = ["TARGET", "CARGO_CFG_SANITIZE"]

[package.crossbeam-epoch]
env = ["TARGET", "CARGO_CFG_SANITIZE"]

[package.crossbeam-deque]
env = ["TARGET", "CARGO_CFG_SANITIZE"]

# Optional override of the bundled data.
[package.icu_properties_data]
env = ["ICU4X_DATA_DIR"]

# Only emit directives and write OUT_DIR, which the floor covers.
[package.rayon-core]
[package.tiny-keccak]
[package.crunchy]

# Match the target triple against tables.
[package.valuable]
env = ["TARGET"]

[package.atomic-polyfill]
env = ["TARGET"]

[package.cortex-m-semihosting]
env = ["TARGET"]

[package.syscalls]
env = ["TARGET"]

[package.objc2]
env = ["TARGET", "CARGO_CFG_TARGET_ABI"]

# Re-exports both triples to the crate.
[package.current_platform]
env = ["HOST", "TARGET"]

# Points dependents at its bundled wasm sources, only on wasm targets.
[package.tree-sitter-language]
env = ["TARGET", "CARGO_MANIFEST_DIR"]

# Panics if more than one backend feature is enabled.
[package.blas-src]
env = [
    "CARGO_FEATURE_ACCELERATE",
    "CARGO_FEATURE_BLIS",
    "CARGO_FEATURE_INTEL_MKL",
    "CARGO_FEATURE_NETLIB",
    "CARGO_FEATURE_OPENBLAS",
    "CARGO_FEATURE_R",
]

# Optional path to a platform configuration, passed on to the crate.
[package.iceoryx2-pal-configuration]
env = ["IOX2_CUSTOM_PLATFORM_CONFIGURATION_PATH"]

# Replays directives a `links = "rb"` dependency would export.
[package.rb-sys-env]
env = ["DEP_RB_ENCODED_CARGO_ARGS"]

# Deletes and recreates OUT_DIR. It ignores errors, so without listing
# OUT_DIR it silently leaves stale contents behind.
[package.scratch]
read = [":out_dir"]

# Read nothing: lalrpop-util checks the build host's `std::env::consts::OS`,
# the others are empty.
[package.lalrpop-util]
[package.decancer]
[package.embassy-time-driver]
[package.nextest-workspace-hack]
