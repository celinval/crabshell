# Depends on crates whose build scripts generate Rust source, parsers or
# linker scripts into `OUT_DIR` from their own data.
[workspace]

[package]
name = "codegen"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# The feature makes its build script generate the zone tables.
chrono-tz = { version = "0.10", features = ["case-insensitive"] }
mime_guess = "2"
web_atoms = "0.1"
oid-registry = "0.8"
snap = "1"
selectors = "0.40"
typetag = "0.2"
linkme = "0.3"
defmt = "1"
gl = "0.14"
smoltcp = "0.14"
fastnum = "0.7"
target-spec = "3"
jetscii = "0.5"
gherkin = "0.16"
# Its default regex engine, onig, compiles C.
grok = { version = "2", default-features = false, features = ["fancy-regex"] }
basic-cookies = "0.1"
iso_currency = "0.7"
tls-parser = "0.12"
# The feature makes its build script generate the swizzle operators.
cgmath = { version = "0.18", features = ["swizzle"] }
terminfo = "0.9"
unicode_names2 = "4.0.0"
# The feature renders its handlebars template; the default one is a TLS stack.
amq-protocol = { version = "10", default-features = false, features = ["codegen"] }
# Compiles the lemon parser generator from C and runs it on its grammar.
sqlite3-parser = "0.17"
# Builds its grammar with rust-peg.
ntriple = "0.1"
cranelift-isle = "0.135"
nano-gemm-f64 = "0.2"
cpp_demangle = "0.5"
# The feature makes its build script generate the entity map.
htmlize = { version = "1.1", features = ["unescape"] }
human_name = "2"
hyphenation = "0.8"
iref = "4"
miniserde = "0.1"
codepage-437 = "0.1"
font-awesome-as-a-crate = "0.3"
packed_struct = "0.10"
pinyin = "0.11"
stop-words = "0.10"
proc-macro-nested = "0.1"
precis-profiles = "0.2"
unicode-general-category = "1.1"
woothee = "0.13"
fst = "0.4"
ss58-registry = "1.51"
