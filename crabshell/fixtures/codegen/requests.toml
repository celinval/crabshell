# What each crate's build script would request, precisely, from the vendor's
# point of view: only what its own code uses, with no knowledge of the host.
# Test-only: crabshell reads it through CRABSHELL_REQUESTS (feature
# `test-requests`) in place of the crates' `[package.metadata.crabshell]`.
# Every build script in the fixture is listed; a crate that reads its own
# files requests exactly those, since the crate root is otherwise narrowed
# away.

# The generators: each reads its data through CARGO_MANIFEST_DIR.
[package.chrono-tz]
read = [":manifest_dir/tz"]
env = ["CARGO_MANIFEST_DIR"]

[package.web_atoms]
read = [":manifest_dir/local_names.txt"]
env = ["CARGO_MANIFEST_DIR"]

[package.tls-parser]
read = [":manifest_dir/scripts/tls-ciphersuites.txt"]
env = ["CARGO_MANIFEST_DIR"]

[package.human_name]
read = [":manifest_dir/build"]
env = ["CARGO_MANIFEST_DIR"]

# Copies its bundled dictionaries into OUT_DIR; a normalization feature
# rebuilds them from the patterns instead.
[package.hyphenation]
read = [":manifest_dir/dictionaries", ":manifest_dir/patterns"]
env = ["CARGO_MANIFEST_DIR"]

# precis-tools, their build dependency, reads the bundled UCD files; their
# networking feature downloads them into OUT_DIR instead.
[package.precis-core]
network = true
read = [":manifest_dir/resources/ucd"]
env = ["CARGO_MANIFEST_DIR"]

[package.precis-profiles]
network = true
read = [":manifest_dir/resources/ucd"]
env = ["CARGO_MANIFEST_DIR"]

# Copies its own `src/place.rs`, renaming a private module after the patch
# version.
[package.miniserde]
read = [":manifest_dir/src/place.rs"]
env = ["CARGO_MANIFEST_DIR", "CARGO_PKG_VERSION_PATCH"]

# Generates tests from `in/` and `tests/`, which the published package drops,
# so here it only checks for them and writes nothing.
[package.cpp_demangle]
read = [":manifest_dir/in", ":manifest_dir/tests"]
env = ["CARGO_MANIFEST_DIR"]

# Generators that open their data relative to the working dir, the crate root.
[package.oid-registry]
read = [":manifest_dir/assets/oid_db.txt"]

[package.gherkin]
read = [":manifest_dir/src/languages.json"]

[package.iso_currency]
read = [":manifest_dir/isodata.tsv"]

# Builds a perfect-hash map of the HTML entities with phf_codegen.
[package.htmlize]
read = [":manifest_dir/entities.json"]

# Lists its dialects and splices each one's `overlaps.rs` into the output.
[package.codepage-437]
read = [":manifest_dir/dialect-specs"]

# Reads every bundled SVG into one generated `match`.
[package.font-awesome-as-a-crate]
read = [":manifest_dir/fontawesome-free-6.2.0-desktop/svgs"]

# Lists its example grammars to emit a test per file.
[package.cranelift-isle]
read = [":manifest_dir/isle_examples"]

# Only the ISO list is read at build time; the other word lists are compiled
# into the script.
[package.stop-words]
read = [":manifest_dir/src/iso/stopwords-iso.json"]
env = ["CARGO_FEATURE_*"]

# Inlines its own `uri` module tree into one generated file, following every
# `mod` declaration it finds.
[package.iref]
read = [":manifest_dir/src/uri"]

# rust-peg reads the grammar, and exits with an error message when it can't.
[package.ntriple]
read = [":manifest_dir/grammar/ntriple.rustpeg"]

# Globs `patterns/*.pattern`; a glob it can't list matches nothing.
[package.grok]
read = [":manifest_dir/patterns"]

# Lists its extensions dir and embeds each file's absolute path in the
# generated `include_bytes!`, for rustc to read.
[package.khronos_api]
read = [":manifest_dir/api_webgl/extensions"]

# Copies its linker script into OUT_DIR and adds it to the link search path.
[package.defmt]
read = [":manifest_dir/defmt.x.in"]
env = ["TARGET"]

# lalrpop walks the whole crate root for `.lalrpop` files, and picks the
# grammar's features from `CARGO_FEATURE_*`.
[package.basic-cookies]
read = [":manifest_dir"]
env = ["CARGO_FEATURE_*", "LALRPOP_LANE_TABLE"]

# Compiles the lemon parser generator and mkkeywordhash from its vendored C,
# then runs both from OUT_DIR. Executing what it just wrote needs OUT_DIR
# readable rather than a `run` entry: nothing can resolve a program that
# doesn't exist when the sandbox is set up.
[package.sqlite3-parser]
read = [":manifest_dir/third_party", ":manifest_dir/src/parser/parse.y", ":out_dir"]
requests = ["cc"]
env = ["HOST"]

# Renders its template with handlebars; both the template and the AMQP spec
# are compiled in, the spec from the build dependency's own sources. It also
# looks for its README beside the manifest or at the workspace root above it,
# and passes the path to rustc, which reads it outside the sandbox. The
# generated file can be redirected to any directory, which no variable names.
[package.amq-protocol]
env = ["CARGO_MANIFEST_DIR", "AMQ_PROTOCOL_CODEGEN_DIR", "AMQ_PROTOCOL_CODEGEN_FILE"]

# Its `generate` feature clones the upstream repository into a temp dir and
# rewrites its own `src/dataset.rs` and tests from the YAML found there,
# through tera templates. Without it the script does nothing.
[package.woothee]
network = true
requests = ["git"]
read = [":manifest_dir/templates"]
write = [":manifest_dir/src", ":manifest_dir/tests"]

# Their data is compiled into the build script, so they only write OUT_DIR.
[package.mime_guess]
[package.snap]
[package.selectors]
[package.terminfo]
[package.cgmath]
[package.gl]
[package.crunchy]
[package.tiny-keccak]
[package.fst]
[package.ss58-registry]
# Their tables come from a `#[path]` module of their own sources, which the
# script compiles in.
[package.unicode-general-category]
[package.unicode-case-mapping]
# Generated by its own build dependency, nano-gemm-codegen.
[package.nano-gemm-f64]
# Its data is read with `include_str!` through `env!("CARGO_MANIFEST_DIR")`,
# when the script is compiled.
[package.pinyin]
# Its size features are read with `cfg!`, when the script is compiled, so it
# consults no variable.
[package.packed_struct]

# Compares the macro it generates with what OUT_DIR already holds, to leave
# the file's mtime alone when nothing changed.
[package.proc-macro-nested]
read = [":out_dir"]

# Generators configured through the environment. These two suffix a private
# module name with the patch version.
[package.typetag]
env = ["CARGO_PKG_VERSION_PATCH"]

[package.linkme]
env = ["CARGO_PKG_VERSION_PATCH"]

# Optional knobs that override the generated constants.
[package.fastnum]
env = [
    "RUST_FASTNUM_DEFAULT_ROUNDING_MODE", "RUST_FASTNUM_FMT_EXPONENTIAL_LOWER_THRESHOLD",
    "RUST_FASTNUM_FMT_EXPONENTIAL_UPPER_THRESHOLD", "RUST_FASTNUM_FMT_MAX_INTEGER_PADDING",
    "RUST_FASTNUM_SERDE_DESERIALIZE_MODE",
]

# Scans the whole environment for `SMOLTCP_*` knobs and sizing features.
[package.smoltcp]
env = ["SMOLTCP_*", "CARGO_FEATURE_*"]

# Writes the target and its features into OUT_DIR.
[package.target-spec]
env = ["TARGET", "CARGO_CFG_TARGET_FEATURE"]

[package.jetscii]
env = ["CARGO_CFG_TARGET_ARCH", "CARGO_CFG_TARGET_FEATURE"]

[package.target-lexicon]
requests = ["rustc"]
env = ["TARGET"]

# Directive-only scripts pulled in by the generators.
[package.serde_json]
env = ["CARGO_CFG_TARGET_ARCH", "CARGO_CFG_TARGET_POINTER_WIDTH"]

[package.icu_locale_fallback_data]
env = ["ICU4X_DATA_DIR"]

[package.icu_segmenter_data]
env = ["ICU4X_DATA_DIR"]

[package.icu_normalizer_data]
env = ["ICU4X_DATA_DIR"]

[package.icu_properties_data]
env = ["ICU4X_DATA_DIR"]

[package.pest_stack_guard]
env = ["TARGET"]

[package.radium]
env = ["TARGET", "CARGO_CFG_TARGET_ARCH"]

# The proc-macro reads DEFMT_LOG; its build script only declares it.
[package.defmt-macros]
[package.guppy-workspace-hack]

# Version probes pulled in by the generators' dependencies (see rustc-probe).
[package.num-traits]
# autocfg compiles its probes into OUT_DIR; without reading them back, it
# silently drops cfgs.
read = [":out_dir"]
requests = ["rustc"]

[package.uncased]
requests = ["rustc"]

[package.libc]
requests = ["rustc"]
env = [
    "CARGO_CFG_LIBC_UNSTABLE_FREEBSD_VERSION", "CARGO_CFG_LIBC_UNSTABLE_GNU_FILE_OFFSET_BITS",
    "CARGO_CFG_LIBC_UNSTABLE_GNU_TIME_BITS", "CARGO_CFG_LIBC_UNSTABLE_MUSL_V1_2",
    "CARGO_CFG_LIBC_UNSTABLE_MUSL_V1_2_3", "CARGO_CFG_LIBC_UNSTABLE_TIME64",
    "CARGO_CFG_LIBC_UNSTABLE_UCLIBC_TIME64",
    "CARGO_CFG_TARGET_ABI", "CARGO_CFG_TARGET_ARCH", "CARGO_CFG_TARGET_ENV",
    "CARGO_CFG_TARGET_OS", "CARGO_CFG_TARGET_POINTER_WIDTH",
    "CARGO_FEATURE_RUSTC_DEP_OF_STD", "LIBC_BUILD_VERBOSE", "LIBC_CI",
    "RUST_LIBC_UNSTABLE_FREEBSD_VERSION", "RUST_LIBC_UNSTABLE_GNU_FILE_OFFSET_BITS",
    "RUST_LIBC_UNSTABLE_GNU_TIME_BITS", "RUST_LIBC_UNSTABLE_MUSL_V1_2_3", "WIND_RELEASE_ID",
]

[package.parking_lot_core]
env = ["CARGO_CFG_SANITIZE"]

[package.crossbeam-utils]
env = ["TARGET", "CARGO_CFG_SANITIZE"]

# version_check.
[package.proc-macro-error]
requests = ["rustc"]

[package.proc-macro-error-attr]
requests = ["rustc"]

[package.rustix]
# Reads rustc's output in OUT_DIR; without it, it silently drops cfgs.
read = [":out_dir"]
requests = ["rustc"]
env = [
    "CARGO_CFG_MIRI", "CARGO_CFG_RUSTIX_NO_LINUX_RAW", "CARGO_CFG_RUSTIX_USE_EXPERIMENTAL_ASM",
    "CARGO_CFG_RUSTIX_USE_EXPERIMENTAL_FEATURES", "CARGO_CFG_RUSTIX_USE_LIBC",
    "CARGO_CFG_TARGET_ABI", "CARGO_CFG_TARGET_ARCH", "CARGO_CFG_TARGET_ENDIAN",
    "CARGO_CFG_TARGET_ENV", "CARGO_CFG_TARGET_OS", "CARGO_CFG_TARGET_POINTER_WIDTH",
    "CARGO_FEATURE_RUSTC_DEP_OF_STD", "CARGO_FEATURE_USE_LIBC", "TARGET",
]

[package.object]
requests = ["rustc"]

# Assembles its stack-switching routines.
[package.psm]
read = [":manifest_dir/src/arch", ":out_dir"]
requests = ["cc"]
env = [
    "CARGO_CFG_MIRI", "CARGO_CFG_TARGET_ARCH", "CARGO_CFG_TARGET_ENDIAN", "CARGO_CFG_TARGET_ENV",
    "CARGO_CFG_TARGET_OS", "HOST",
]

[package.stacker]
env = ["TARGET"]

[package.proc-macro2]
# Reads compile probes from its own sources, and rustc's output in OUT_DIR.
read = [":manifest_dir/src/probe", ":out_dir"]
requests = ["rustc"]
env = ["RUSTC_BOOTSTRAP", "RUSTC_STAGE", "TARGET"]

[package.quote]
requests = ["rustc"]

[package.serde]
requests = ["rustc"]
env = ["CARGO_PKG_VERSION_PATCH"]

[package.serde_core]
requests = ["rustc"]
env = ["CARGO_PKG_VERSION_PATCH", "TARGET"]

[package.thiserror]
read = [":manifest_dir/build/probe.rs", ":out_dir"]
requests = ["rustc"]
env = ["CARGO_PKG_VERSION_PATCH", "RUSTC_BOOTSTRAP", "RUSTC_STAGE", "TARGET"]

[package.erased-serde]
requests = ["rustc"]

[package.typeid]
requests = ["rustc"]

[package.linkme-impl]
requests = ["rustc"]

[package.syn]
requests = ["rustc"]

[package.zmij]
requests = ["rustc"]
env = ["OPT_LEVEL"]

[package.rustversion]
requests = ["rustc"]
env = ["HOST"]

# Compiles an asm probe from OUT_DIR. It fails on x86 either way, so a denied
# probe goes unnoticed there.
[package.heapless]
read = [":out_dir"]
requests = ["rustc"]
env = ["TARGET"]

# Reads the version table in its own Cargo.toml and runs `$RUSTC --version`.
[package.zerocopy]
read = [":manifest_dir/Cargo.toml"]
requests = ["rustc"]

# Its data is compiled into the build script, so it only writes OUT_DIR.
[package.unicode_names2]

# Rewrite their README into OUT_DIR for rustdoc to include. Each reads it
# relative to the working dir, the crate root, so it requests just that file.
[package.rust_decimal]
read = [":manifest_dir/README.md"]

# readme-rustdocifier names the crate in the rewritten links, so both it and
# its consumer fail outright without the package metadata.
[package.readme-rustdocifier]
read = [":manifest_dir/README.md"]
env = ["CARGO_PKG_NAME", "CARGO_PKG_VERSION"]

[package.reed-solomon-simd]
read = [":manifest_dir/README.md"]
env = ["CARGO_PKG_NAME", "CARGO_PKG_VERSION"]

# skeptic turns the README's code blocks into tests in OUT_DIR, finding it
# through CARGO_MANIFEST_DIR and naming the target triple in each test.
[package.ply-rs]
read = [":manifest_dir/README.md"]
env = ["CARGO_MANIFEST_DIR", "TARGET"]

# Compresses its dictionary into OUT_DIR, through CARGO_MANIFEST_DIR.
[package.irg-kvariants]
read = [":manifest_dir/dictionaries/source/kVariants.tsv"]
env = ["CARGO_MANIFEST_DIR"]

# Parse their bundled data and serialize it into OUT_DIR: the Jsonnet
# standard library, compiled into the build script, and the metadata XML,
# read relative to the crate root.
[package.jrsonnet-evaluator]

[package.phonenumber]
read = [":manifest_dir/assets/PhoneNumberMetadata.xml"]

# Precompiles the tokenizer DFAs for the target's byte order.
[package.riptoken]
env = ["CARGO_CFG_TARGET_ENDIAN"]

# Version probes and directive-only scripts the generators pull in (see
# rustc-probe and cfg-only).
[package.camino]
requests = ["rustc"]

# version_check runs `$RUSTC --version`, and the profile becomes a cfg.
[package.error-chain]
requests = ["rustc"]
env = ["PROFILE"]

[package.getrandom]
requests = ["rustc"]
env = ["CARGO_CFG_SANITIZE", "CARGO_CFG_TARGET_FAMILY"]

[package.rustix]
# Reads rustc's output in OUT_DIR; without it, it silently drops cfgs.
read = [":out_dir"]
requests = ["rustc"]
env = [
    "CARGO_CFG_MIRI", "CARGO_CFG_RUSTIX_NO_LINUX_RAW", "CARGO_CFG_RUSTIX_USE_EXPERIMENTAL_ASM",
    "CARGO_CFG_RUSTIX_USE_EXPERIMENTAL_FEATURES", "CARGO_CFG_RUSTIX_USE_LIBC",
    "CARGO_CFG_TARGET_ABI", "CARGO_CFG_TARGET_ARCH", "CARGO_CFG_TARGET_ENDIAN",
    "CARGO_CFG_TARGET_ENV", "CARGO_CFG_TARGET_OS", "CARGO_CFG_TARGET_POINTER_WIDTH",
    "CARGO_FEATURE_RUSTC_DEP_OF_STD", "CARGO_FEATURE_USE_LIBC", "TARGET",
]

[package.crossbeam-utils]
env = ["TARGET", "CARGO_CFG_SANITIZE"]

[package.crossbeam-epoch]
env = ["TARGET", "CARGO_CFG_SANITIZE"]

[package.crossbeam-deque]
env = ["TARGET", "CARGO_CFG_SANITIZE"]

# Only emit directives and write OUT_DIR, which the floor covers.
[package.rayon-core]
[package.pulldown-cmark]
