# Depends on crates whose build scripts configure bindings to a language
# runtime: Python (pyo3 and its users), Node-API, the JVM, Erlang NIFs,
# Swift and UniFFI.
[workspace]

[package]
name = "lang-runtime"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# `extension-module` and `generate-import-lib` pick the pyo3 build that links
# no libpython; pyo3 stays on 0.29, the last version malachite-nz takes (two
# pyo3-ffi versions would claim the same `links = "python"`).
pyo3 = { version = "0.29", features = ["extension-module", "generate-import-lib"] }
numpy = "0.29"
jni = "0.22"
napi = "3"
oxc_sourcemap = { version = "10", features = ["napi"] }
neon-build = "0.10"
rustler = "0.38"
rustler_sys = "2.4"
swift-rs = { version = "1", features = ["build"] }
glean-core = "71"
jiter = { version = "0.17", features = ["python"] }
malachite-nz = { version = "0.14", features = ["enable_pyo3"] }
clarabel = "0.11"
mundy = "0.2"
