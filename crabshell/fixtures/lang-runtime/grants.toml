#:schema ../../schema/sandbox.schema.json
# Running the Python interpreter to read its configuration, which crabshell
# has no built-in grant for.
[grant.python]
run = ["python3"]
read = [
    "/usr/lib64/python3*", "/usr/lib/python3*", "/usr/include/python3*",
    "/lib64/libpython3*", "/usr/lib/x86_64-linux-gnu/libpython3*",
    # Debian's interpreter links libpython statically, but loads these.
    "/lib/x86_64-linux-gnu/libexpat.so.1", "/lib/x86_64-linux-gnu/libz.so.1",
]
env = ["PYO3_*", "VIRTUAL_ENV", "CONDA_PREFIX", "_PYTHON_SYSCONFIGDATA_NAME", "PATH"]
