#:schema ../../schema/sandbox.schema.json
# The tightest consumer policy that works without crate requests: the union of
# requests.toml, granted to every external crate.
[external]
# OUT_DIR is write-only; compile probes read back what they write.
read = { inherit = true, value = [":out_dir"] }
grants = ["rustc", "python"]
# The default grant already covers TARGET, HOST, CARGO_CFG_* and
# CARGO_FEATURE_*, so only the rest is added.
env = { inherit = true, value = [
    "CARGO_PKG_VERSION", "UNSAFE_PYO3_SKIP_VERSION_CHECK", "DEP_PYTHON_PYO3_CONFIG",
    "RUSTC_BOOTSTRAP", "RUSTC_STAGE", "LIBC_BUILD_VERBOSE", "LIBC_CI",
    "RUST_LIBC_UNSTABLE_*", "WIND_RELEASE_ID",
] }

# Running the Python interpreter to read its configuration, which crabshell
# has no built-in grant for.
[grant.python]
run = ["python3"]
read = [
    "/usr/lib64/python3*", "/usr/lib/python3*", "/usr/include/python3*",
    "/lib64/libpython3*", "/usr/lib/x86_64-linux-gnu/libpython3*",
    # Debian's interpreter links libpython statically, but loads these.
    "/lib/x86_64-linux-gnu/libexpat.so.1", "/lib/x86_64-linux-gnu/libz.so.1",
]
env = ["PYO3_*", "VIRTUAL_ENV", "CONDA_PREFIX", "_PYTHON_SYSCONFIGDATA_NAME", "PATH"]
