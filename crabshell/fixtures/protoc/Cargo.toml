# Depends on crates whose build scripts generate Rust from `.proto` files:
# through protoc (vendored, or the one `PROTOC` names), or through pure-Rust
# parsers. Its own build script compiles `proto/` with the vendored protoc.
[workspace]

[package]
name = "protoc"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
prost = "0.14"
prost-types = "0.14"
# Run the vendored protoc themselves.
perfetto_protos = "0.51"
# Pure-Rust parsers: protobuf-codegen's, or protox.
containerd-shim-protos = "0.11"
prometheus-client = { version = "0.25", features = ["protobuf", "protobuf-protox"] }
prost-wkt-types = { version = "0.7", features = ["vendored-protox"] }
sentencepiece-model = "0.1"
ttrpc = "0.9"
yara-x-proto = "1"
# Use checked-in code unless their own files say otherwise.
geozero = { version = "0.15", default-features = false, features = ["with-mvt"] }
pbjson-types = "0.9"
pprof = { version = "0.15", default-features = false, features = ["prost-codec"] }
libdd-ddsketch = "1"
# Run the protoc that `PROTOC` names.
cedar-policy = { version = "4", features = ["protobufs"] }
containerd-client = { version = "0.9", default-features = false }
etcd-client = "0.20"
prost-validate-types = "0.2"
tracing-perfetto-sdk-schema = "0.13"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["protobuf"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
