#:schema ../../schema/sandbox.schema.json
# A loose consumer policy: the category's grants and any environment variable.
include = ["grants.toml"]

[local]
grants = ["protoc"]
env = ["*"]

[external]
# OUT_DIR is write-only; generators, compile probes and cc-rs read back what
# they write.
read = { inherit = true, value = [":out_dir"] }
grants = ["rustc", "cc", "protoc"]
env = ["*"]
