# Depends on crates whose build scripts run `$RUSTC` to detect its version or
# probe for compiler features.
[workspace]

[package]
name = "rustc-probe"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
ahash = "0.8"
allocative = "0.3"
anyhow = "1"
async-io = "2"
atomic-traits = "0.4"
bigdecimal = "0.4"
bnum = "0.14"
branches = "0.5"
camino = "1"
circular-queue = "0.2"
const_fn = "0.4"
constant_time_eq = "0.6"
cookie = "0.18"
crc32c = "0.6"
crc32fast = "1"
decorum = "0.4"
doc-comment = "0.3"
encoding_rs = "0.8"
erasable = "1"
erased-serde = "0.4"
error-chain = "0.12"
eyre = "0.6"
field-offset = "0.3"
fixed = "1"
flatbuffers = "25"
float16 = "0.1"
fs-err = "3"
getrandom = "0.3"
heapless = "0.9"
hex_lit = "0.1"
httparse = "1"
im-rc = "15"
io-lifetimes = "3"
libc = "0.2"
matrixmultiply = "0.3"
maybe-uninit = "2"
memoffset = "0.9"
multer = { version = "3", default-features = false }
nix = "0.30"
no-panic = "0.1"
parking_lot_core = "0.9"
paste = "1"
portable-atomic-util = "0.2"
proc-macro-error = "1"
proc-macro-hack = "0.5"
proc-macro2 = "1"
proc-macro2-diagnostics = "0.10"
ref-cast = "1"
rstest_macros = "0.27"
rustix = "1"
rustversion = "1"
s2n-quic-platform = { version = "0.88", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
slice-dst = "1"
slog = "2"
slotmap = "1"
stabby-abi = "72"
substring = "1"
thiserror = "2"
typeid = "1"
wasm-bindgen = "0.2"
zerocopy = "0.8"
zmij = "1"
