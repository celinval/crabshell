# Depends on crates whose build scripts run `$RUSTC` to detect its version or
# probe for compiler features.
[workspace]

[package]
name = "rustc-probe"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
ahash = "0.8"
anyhow = "1"
async-io = "2"
camino = "1"
constant_time_eq = "0.6"
cookie = "0.18"
crc32fast = "1"
doc-comment = "0.3"
encoding_rs = "0.8"
erased-serde = "0.4"
eyre = "0.6"
fs-err = "3"
getrandom = "0.3"
heapless = "0.9"
httparse = "1"
io-lifetimes = "3"
libc = "0.2"
matrixmultiply = "0.3"
memoffset = "0.9"
nix = "0.30"
parking_lot_core = "0.9"
paste = "1"
portable-atomic-util = "0.2"
proc-macro-error = "1"
proc-macro-hack = "0.5"
proc-macro2 = "1"
ref-cast = "1"
rustix = "1"
rustversion = "1"
serde = { version = "1", features = ["derive"] }
slotmap = "1"
thiserror = "2"
typeid = "1"
zerocopy = "0.8"
zmij = "1"
