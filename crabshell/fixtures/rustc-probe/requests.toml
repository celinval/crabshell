# What each crate's build script would request, precisely, from the vendor's
# point of view: only what its own code uses, with no knowledge of the host.
# Test-only: crabshell reads it through CRABSHELL_REQUESTS (feature
# `test-requests`) in place of the crates' `[package.metadata.crabshell]`.
# Every build script that runs is listed; a crate that reads its own files
# requests exactly those, since the crate root is otherwise narrowed away.
# Running `$RUSTC` comes from the `rustc` grant, which also covers RUSTC, its
# wrappers and CARGO_ENCODED_RUSTFLAGS. crunchy's and wit-bindgen's scripts
# only build for wasm targets, so they never run here.
#
# Crates using a build-dependency library request what it reads on their
# behalf: version_check needs only `rustc`; autocfg also compiles probes into
# OUT_DIR, reads them back, and passes TARGET to rustc.

# version_check.
[package.ahash]
requests = ["rustc"]
env = ["CARGO_CFG_TARGET_ARCH"]

# Runs `$RUSTC --version` and asserts on its output, so denial fails the build.
[package.allocative]
requests = ["rustc"]

[package.anyhow]
# Compiles a probe from its own sources into OUT_DIR, and removes it after.
read = [":manifest_dir/src/nightly.rs", ":out_dir"]
requests = ["rustc"]
env = ["RUSTC_BOOTSTRAP", "RUSTC_STAGE", "TARGET"]

# autocfg, for a version check only.
[package.async-io]
read = [":out_dir"]
requests = ["rustc"]
env = ["TARGET"]

# rustc_version, which also runs RUSTC_WRAPPER. It unwraps the result, so
# denial fails the build instead of degrading.
[package.atomic-traits]
requests = ["rustc"]

# autocfg, plus generated source configured through its own knobs.
[package.bigdecimal]
read = [":out_dir"]
requests = ["rustc"]
env = [
    "RUST_BIGDECIMAL_DEFAULT_PRECISION", "RUST_BIGDECIMAL_DEFAULT_ROUNDING_MODE",
    "RUST_BIGDECIMAL_FMT_EXPONENTIAL_LOWER_THRESHOLD",
    "RUST_BIGDECIMAL_FMT_EXPONENTIAL_UPPER_THRESHOLD",
    "RUST_BIGDECIMAL_FMT_MAX_INTEGER_PADDING", "RUST_BIGDECIMAL_SERDE_SCALE_LIMIT",
    "TARGET",
]

# Runs `rustc` from PATH rather than `$RUSTC`, like doc-comment. It also
# checks whether overflow checks are on by overflowing in its own process.
[package.bnum]

# Parses `release:` out of `$RUSTC -vV`, through RUSTC_WRAPPER when set.
[package.branches]
requests = ["rustc"]
env = ["OPT_LEVEL"]

[package.camino]
requests = ["rustc"]

# version_check.
[package.circular-queue]
requests = ["rustc"]

# Runs `$RUSTC -vV` itself, through RUSTC_WRAPPER, and parses `release:`. It
# scans CARGO_ENCODED_RUSTFLAGS for `-Z assume-incomplete-release`, and writes
# the version it found to OUT_DIR, which its own `include!` reads.
[package.const_fn]
requests = ["rustc"]
env = ["CONST_FN_DENY_WARNINGS", "HOST", "RUSTC_BOOTSTRAP"]

# rustversion's `cfg!` runs when the build script is compiled, not when it
# runs, so the script itself needs no `rustc`.
[package.constant_time_eq]
env = ["CARGO_CFG_TARGET_ARCH"]

# version_check.
[package.cookie]
requests = ["rustc"]

# rustc_version, plus CRC tables written to OUT_DIR.
[package.crc32c]
requests = ["rustc"]

[package.crc32fast]
requests = ["rustc"]

# Pulled in by async-io (see cfg-only).
[package.crossbeam-utils]
env = ["TARGET", "CARGO_CFG_SANITIZE"]

# rustversion's attribute macros, evaluated when the script compiles.
[package.decorum]

# Runs `rustc` from PATH rather than `$RUSTC`. A request can't express that
# portably (under rustup it's a proxy needing its own env), so detection
# fails silently; it only matters before rustc 1.30.
[package.doc-comment]

# Only rustversion's `cfg!`, like constant_time_eq.
[package.encoding_rs]

# autocfg expression probes, plus a knob of its own.
[package.erasable]
read = [":out_dir"]
requests = ["rustc"]
env = ["ERASABLE_ENFORCE_1_1_0_SEMANTICS", "TARGET"]

[package.erased-serde]
requests = ["rustc"]

# version_check, plus the profile, which it turns into a cfg.
[package.error-chain]
requests = ["rustc"]
env = ["PROFILE"]

[package.eyre]
# autocfg, plus its own probe written to OUT_DIR. The probe needs a nightly
# feature, so rustc must inherit RUSTC_BOOTSTRAP, although the script never
# reads it.
read = [":out_dir"]
requests = ["rustc"]
env = ["RUSTC_BOOTSTRAP", "TARGET"]

# rustc_version, unwrapped.
[package.field-offset]
requests = ["rustc"]

# Needs RUSTC and OUT_DIR, and panics without either, although the probes it
# reads them for are dead code in this version.
[package.fixed]
requests = ["rustc"]

# rustc_version, for the channel.
[package.flatbuffers]
requests = ["rustc"]

[package.float16]
requests = ["rustc"]

# autocfg, for version checks only.
[package.fs-err]
read = [":out_dir"]
