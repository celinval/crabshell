# What each crate's build script would request, precisely, from the vendor's
# point of view: only what its own code uses, with no knowledge of the host.
# Test-only: crabshell reads it through CRABSHELL_REQUESTS (feature
# `test-requests`) in place of the crates' `[package.metadata.crabshell]`.
# Every build script in the fixture is listed; a crate that reads its own
# files requests exactly those, since the crate root is otherwise narrowed
# away. Running
# `$RUSTC` comes from the
# `rustc` grant, which also covers RUSTC, its wrappers and
# CARGO_ENCODED_RUSTFLAGS.
#
# Crates using a build-dependency library request what it reads on their
# behalf: version_check needs only `rustc`; autocfg also compiles probes into
# OUT_DIR, reads them back, and passes TARGET to rustc.

[package.anyhow]
# Compiles a probe from its own sources into OUT_DIR, and removes it after.
read = [":manifest_dir/src/nightly.rs", ":out_dir"]
requests = ["rustc"]
env = ["RUSTC_BOOTSTRAP", "RUSTC_STAGE", "TARGET"]

# autocfg, for a version check only.
[package.async-io]
read = [":out_dir"]
requests = ["rustc"]
env = ["TARGET"]

[package.camino]
requests = ["rustc"]

# rustversion's `cfg!` runs when the build script is compiled, not when it
# runs, so the script itself needs no `rustc`.
[package.constant_time_eq]
env = ["CARGO_CFG_TARGET_ARCH"]

# version_check.
[package.cookie]
requests = ["rustc"]

[package.crc32fast]
requests = ["rustc"]

# Pulled in by async-io (see cfg-only).
[package.crossbeam-utils]
env = ["TARGET", "CARGO_CFG_SANITIZE"]

# Runs `rustc` from PATH rather than `$RUSTC`. A request can't express that
# portably (under rustup it's a proxy needing its own env), so detection
# fails silently; it only matters before rustc 1.30.
[package.doc-comment]

# Only rustversion's `cfg!`, like constant_time_eq.
[package.encoding_rs]

[package.erased-serde]
requests = ["rustc"]

[package.eyre]
# autocfg, plus its own probe written to OUT_DIR. The probe needs a nightly
# feature, so rustc must inherit RUSTC_BOOTSTRAP, although the script never
# reads it.
read = [":out_dir"]
requests = ["rustc"]
env = ["RUSTC_BOOTSTRAP", "TARGET"]

# autocfg, for version checks only.
[package.fs-err]
read = [":out_dir"]
requests = ["rustc"]
env = ["TARGET"]

[package.getrandom]
requests = ["rustc"]
env = ["CARGO_CFG_SANITIZE", "CARGO_CFG_TARGET_FAMILY"]

[package.heapless]
# Writes a probe to OUT_DIR for rustc to compile.
read = [":out_dir"]
requests = ["rustc"]
env = ["TARGET"]

[package.httparse]
requests = ["rustc"]
env = [
    "CARGO_CFG_HTTPARSE_DISABLE_SIMD", "CARGO_CFG_HTTPARSE_DISABLE_SIMD_COMPILETIME",
    "CARGO_CFG_MIRI", "CARGO_CFG_TARGET_FEATURE", "CARGO_FEATURE_STD",
]

# Compiles a probe into OUT_DIR, only when targeting WASI.
[package.io-lifetimes]
read = [":out_dir"]
requests = ["rustc"]
env = ["CARGO_CFG_TARGET_OS", "TARGET"]

[package.libc]
requests = ["rustc"]
env = [
    "CARGO_CFG_LIBC_UNSTABLE_FREEBSD_VERSION", "CARGO_CFG_LIBC_UNSTABLE_GNU_FILE_OFFSET_BITS",
    "CARGO_CFG_LIBC_UNSTABLE_GNU_TIME_BITS", "CARGO_CFG_LIBC_UNSTABLE_MUSL_V1_2",
    "CARGO_CFG_LIBC_UNSTABLE_MUSL_V1_2_3", "CARGO_CFG_LIBC_UNSTABLE_TIME64",
    "CARGO_CFG_LIBC_UNSTABLE_UCLIBC_TIME64",
    "CARGO_CFG_TARGET_ABI", "CARGO_CFG_TARGET_ARCH", "CARGO_CFG_TARGET_ENV",
    "CARGO_CFG_TARGET_OS", "CARGO_CFG_TARGET_POINTER_WIDTH",
    "CARGO_FEATURE_RUSTC_DEP_OF_STD", "LIBC_BUILD_VERBOSE", "LIBC_CI",
    "RUST_LIBC_UNSTABLE_FREEBSD_VERSION", "RUST_LIBC_UNSTABLE_GNU_FILE_OFFSET_BITS",
    "RUST_LIBC_UNSTABLE_GNU_TIME_BITS", "RUST_LIBC_UNSTABLE_MUSL_V1_2_3", "WIND_RELEASE_ID",
]

# autocfg, for version checks only.
[package.matrixmultiply]
read = [":out_dir"]
requests = ["rustc"]
env = ["CARGO_CFG_TARGET_ARCH", "CARGO_FEATURE_AVX512", "TARGET"]

# autocfg, for version checks only.
[package.memoffset]
read = [":out_dir"]
