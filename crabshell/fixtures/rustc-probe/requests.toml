env = ["CARGO_CFG_SANITIZE", "CARGO_CFG_TARGET_FAMILY"]

[package.heapless]
# Writes a probe to OUT_DIR for rustc to compile.
read = [":out_dir"]
requests = ["rustc"]
env = ["TARGET"]

# Runs `$RUSTC --version`, falling back to `rustc` on PATH, and panics if
