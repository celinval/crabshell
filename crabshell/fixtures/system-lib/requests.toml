# What each crate's build script would request, precisely, from the vendor's
# point of view: only what its own code uses, with no knowledge of the host.
# Test-only: crabshell reads it through CRABSHELL_REQUESTS (feature
# `test-requests`) in place of the crates' `[package.metadata.crabshell]`.
# Every build script in the fixture is listed; a crate that reads its own
# files requests exactly those, since the crate root is otherwise narrowed
# away. Tools come from named grants
# (`rustc`, `pkg-config`, `cc`); a crate lists the knobs it reads itself,
# including the pkg-config crate's per-library `<LIB>_NO_PKG_CONFIG`,
# `<LIB>_STATIC` and `<LIB>_DYNAMIC`.

[package.libc]
requests = ["rustc"]
env = [
    "CARGO_CFG_LIBC_UNSTABLE_FREEBSD_VERSION", "CARGO_CFG_LIBC_UNSTABLE_GNU_FILE_OFFSET_BITS",
    "CARGO_CFG_LIBC_UNSTABLE_GNU_TIME_BITS", "CARGO_CFG_LIBC_UNSTABLE_MUSL_V1_2",
    "CARGO_CFG_LIBC_UNSTABLE_MUSL_V1_2_3", "CARGO_CFG_LIBC_UNSTABLE_TIME64",
    "CARGO_CFG_LIBC_UNSTABLE_UCLIBC_TIME64",
    "CARGO_CFG_TARGET_ABI", "CARGO_CFG_TARGET_ARCH", "CARGO_CFG_TARGET_ENV",
    "CARGO_CFG_TARGET_OS", "CARGO_CFG_TARGET_POINTER_WIDTH",
    "CARGO_FEATURE_RUSTC_DEP_OF_STD", "LIBC_BUILD_VERBOSE", "LIBC_CI",
    "RUST_LIBC_UNSTABLE_FREEBSD_VERSION", "RUST_LIBC_UNSTABLE_GNU_FILE_OFFSET_BITS",
    "RUST_LIBC_UNSTABLE_GNU_TIME_BITS", "RUST_LIBC_UNSTABLE_MUSL_V1_2_3", "WIND_RELEASE_ID",
]

[package.libsqlite3-sys]
# Reads pre-generated bindings for the linked library, and the vendored
# sqlite3 (with its own bindings) when bundled.
read = [":manifest_dir/bindgen-bindings", ":manifest_dir/sqlite3"]
requests = ["pkg-config"]
env = [
    "CARGO_CFG_TARGET_ENV", "CARGO_CFG_TARGET_OS", "CARGO_CFG_WINDOWS", "DEP_OPENSSL_INCLUDE",
    "HOST", "TARGET", "LIBSQLITE3_FLAGS", "LIBSQLITE3_SYS_BUNDLING", "LIBSQLITE3_SYS_USE_PKG_CONFIG",
    "SQLITE_MAX_COLUMN", "SQLITE_MAX_EXPR_DEPTH", "SQLITE_MAX_VARIABLE_NUMBER",
    "SQLITE3_INCLUDE_DIR", "SQLITE3_LIB_DIR", "SQLITE3_STATIC",
    "SQLITE3_NO_PKG_CONFIG", "SQLITE3_DYNAMIC",
]

[package.libz-sys]
# Reads its zlib check, and the vendored zlib as a fallback. cc-rs opens its
# files in OUT_DIR read-write.
read = [":manifest_dir/src/smoke.c", ":manifest_dir/src/zlib", ":out_dir"]
requests = ["pkg-config", "cc"]
env = [
    "CARGO_CFG_TARGET_ARCH", "CARGO_CFG_TARGET_FEATURE", "HOST", "TARGET",
    "ZLIB_NO_PKG_CONFIG", "ZLIB_STATIC", "ZLIB_DYNAMIC",
]

[package.lzma-sys]
# Reads the vendored xz, used unless pkg-config finds one. The glob keeps the
# request valid when the vendored version changes.
read = [":manifest_dir/xz-*"]
requests = ["pkg-config", "cc"]
env = [
    "CARGO_CFG_TARGET_ENDIAN", "LZMA_API_STATIC", "TARGET",
    "LIBLZMA_NO_PKG_CONFIG", "LIBLZMA_STATIC", "LIBLZMA_DYNAMIC",
]

# openssl-sys also reads each knob prefixed with the target triple
# (`X86_64_UNKNOWN_LINUX_GNU_OPENSSL_DIR`). A vendor can't name the triple in
# advance, and patterns only match prefixes, so it's listed for this host.
[package.openssl-sys]
# Reads the header it expands to detect the OpenSSL version. cc-rs opens its
# files in OUT_DIR read-write.
read = [":manifest_dir/build/expando.c", ":out_dir"]
requests = ["pkg-config", "cc"]
env = [
    "CARGO_CFG_TARGET_OS", "CARGO_CFG_TARGET_POINTER_WIDTH", "CARGO_CFG_UNIX", "DEP_BSSL_CONF",
    "HOST", "TARGET",
    "OPENSSL_CONFIG_DIR", "OPENSSL_DIR", "OPENSSL_INCLUDE_DIR", "OPENSSL_LIBS",
    "OPENSSL_LIB_DIR", "OPENSSL_NO_VENDOR", "OPENSSL_STATIC",
    "OPENSSL_NO_PKG_CONFIG", "OPENSSL_DYNAMIC",
    "X86_64_UNKNOWN_LINUX_GNU_OPENSSL_CONFIG_DIR", "X86_64_UNKNOWN_LINUX_GNU_OPENSSL_DIR",
    "X86_64_UNKNOWN_LINUX_GNU_OPENSSL_INCLUDE_DIR", "X86_64_UNKNOWN_LINUX_GNU_OPENSSL_LIBS",
    "X86_64_UNKNOWN_LINUX_GNU_OPENSSL_LIB_DIR", "X86_64_UNKNOWN_LINUX_GNU_OPENSSL_NO_VENDOR",
    "X86_64_UNKNOWN_LINUX_GNU_OPENSSL_STATIC",
]

[package.zstd-sys]
# Reads the vendored zstd, used unless pkg-config finds one.
read = [":manifest_dir/zstd"]
requests = ["pkg-config", "cc"]
env = [
    "CARGO_CFG_TARGET_ARCH", "CARGO_CFG_TARGET_ENV", "CARGO_CFG_TARGET_OS", "CARGO_CFG_WINDOWS",
    "CARGO_MANIFEST_DIR", "TARGET", "ZSTD_SYS_NO_HIDE_SYMBOLS", "ZSTD_SYS_USE_PKG_CONFIG",
    "LIBZSTD_NO_PKG_CONFIG", "LIBZSTD_STATIC", "LIBZSTD_DYNAMIC",
]

[package.clang-sys]
# With `runtime`, the script only checks the features it was built with.

[package.inotify-sys]
# Runs pkg-config only on NetBSD and OpenBSD.
requests = ["pkg-config"]
env = ["CARGO_CFG_TARGET_OS"]

[package.libpulse-sys]
# Falls back to linking `libpulse.so.0` by name when pkg-config doesn't know
# libpulse, or can't run.
requests = ["pkg-config"]
env = ["DOCS_RS", "LIBPULSE_NO_PKG_CONFIG", "LIBPULSE_STATIC", "LIBPULSE_DYNAMIC"]

[package.libpulse-simple-sys]
requests = ["pkg-config"]
env = [
    "DOCS_RS", "LIBPULSE_SIMPLE_NO_PKG_CONFIG", "LIBPULSE_SIMPLE_STATIC",
    "LIBPULSE_SIMPLE_DYNAMIC",
]

[package.libseccomp]
# Probes libseccomp only to emit a cfg for 2.6, so without it nothing fails.
requests = ["pkg-config"]
env = [
    "HOST", "TARGET", "LIBSECCOMP_LIB_PATH",
    "LIBSECCOMP_NO_PKG_CONFIG", "LIBSECCOMP_STATIC", "LIBSECCOMP_DYNAMIC",
]

[package.libseccomp-sys]
env = ["LIBSECCOMP_LIB_PATH", "LIBSECCOMP_LINK_TYPE"]

[package.mongocrypt-sys]
env = ["MONGOCRYPT_LIB_DIR"]

[package.num-traits]
# autocfg compiles its probes into OUT_DIR; without reading them back, it
# silently drops cfgs.
read = [":out_dir"]
requests = ["rustc"]

[package.odbc-sys]
# Also reads ODBC_SYS_STATIC_PATH and DYLD_LIBRARY_PATH, but through
# `option_env!`, when the script is compiled; and runs `brew` on macOS.
env = ["CARGO_FEATURE_STATIC", "CARGO_FEATURE_STATIC_LTDL"]

[package.openmp-sys]
# Asks the C compiler for its library dirs and looks for libgomp there.
# cc-rs detects the compiler family through a file it opens read-write in
# OUT_DIR; denied, it warns and guesses.
read = [":out_dir"]
requests = ["cc"]
env = ["CC", "LIBRARY_PATH", "OPENMP_STATIC", "PATH", "TARGET"]

[package.pcap]
# Without pkg-config, dlopens `libpcap.so` to ask its version, and assumes
# the newest when that fails.
requests = ["pkg-config"]
env = [
    "DOCS_RS", "LIBPCAP_LIBDIR", "LIBPCAP_VER",
    "LIBPCAP_NO_PKG_CONFIG", "LIBPCAP_STATIC", "LIBPCAP_DYNAMIC",
]

[package.proc-macro2]
# Reads compile probes from its own sources, and rustc's output in OUT_DIR.
read = [":manifest_dir/src/probe", ":out_dir"]
requests = ["rustc"]
env = ["RUSTC_BOOTSTRAP", "RUSTC_STAGE", "TARGET"]

[package.quote]
requests = ["rustc"]

[package.tiny-xlib]
# With `dlopen`, records each library's libdir from pkg-config in OUT_DIR,
# or None.
requests = ["pkg-config"]
env = [
    "CARGO_FEATURE_DLOPEN", "X11_NO_PKG_CONFIG", "X11_STATIC", "X11_DYNAMIC",
    "X11_XCB_NO_PKG_CONFIG", "X11_XCB_STATIC", "X11_XCB_DYNAMIC",
]

[package.winapi]
env = ["TARGET", "WINAPI_NO_BUNDLED_LIBRARIES", "WINAPI_STATIC_NOBUNDLE"]

[package.x11-dl]
# Records each X11 library's libdir from pkg-config in OUT_DIR, or None.
requests = ["pkg-config"]
env = [
    "TARGET",
    "XEXT_STATIC", "XEXT_DYNAMIC", "GL_STATIC", "GL_DYNAMIC", "XCURSOR_STATIC",
    "XCURSOR_DYNAMIC", "XXF86VM_STATIC", "XXF86VM_DYNAMIC", "XFT_STATIC", "XFT_DYNAMIC",
    "XINERAMA_STATIC", "XINERAMA_DYNAMIC", "XI_STATIC", "XI_DYNAMIC", "X11_STATIC",
    "X11_DYNAMIC", "X11_XCB_STATIC", "X11_XCB_DYNAMIC", "XMU_STATIC", "XMU_DYNAMIC",
    "XRANDR_STATIC", "XRANDR_DYNAMIC", "XTST_STATIC", "XTST_DYNAMIC", "XRENDER_STATIC",
    "XRENDER_DYNAMIC", "XPRESENT_STATIC", "XPRESENT_DYNAMIC", "XSCRNSAVER_STATIC",
    "XSCRNSAVER_DYNAMIC", "XT_STATIC", "XT_DYNAMIC",
]

[package.yeslogic-fontconfig-sys]
# Probes fontconfig unless the `dlopen` feature or RUST_FONTCONFIG_DLOPEN is set.
requests = ["pkg-config"]
env = [
    "RUST_FONTCONFIG_DLOPEN", "FONTCONFIG_NO_PKG_CONFIG", "FONTCONFIG_STATIC",
    "FONTCONFIG_DYNAMIC",
]
