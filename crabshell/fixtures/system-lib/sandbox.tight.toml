#:schema ../../schema/sandbox.schema.json
# The tightest consumer policy that works without crate requests: the union of
# requests.toml, granted to every external crate.
[external]
# OUT_DIR is write-only; compile probes and cc-rs read back what they write.
read = { inherit = true, value = [":out_dir"] }
grants = ["rustc", "pkg-config", "cc"]
# The default grant already covers TARGET, HOST, CARGO_CFG_* and
# CARGO_FEATURE_*, so only the rest is added.
env = { inherit = true, value = [
    "CARGO_MANIFEST_DIR", "DEP_OPENSSL_INCLUDE",
    "DEP_BSSL_CONF", "LIBC_BUILD_VERBOSE", "LIBC_CI", "RUST_LIBC_UNSTABLE_*",
    "WIND_RELEASE_ID", "LIBSQLITE3_*", "SQLITE_MAX_*", "SQLITE3_*", "ZLIB_*",
    "LZMA_API_STATIC", "LIBLZMA_*", "OPENSSL_*",
    "X86_64_UNKNOWN_LINUX_GNU_OPENSSL_*", "ZSTD_SYS_*", "LIBZSTD_*",
    "RUSTC_BOOTSTRAP", "RUSTC_STAGE", "DOCS_RS", "LIBPULSE_*", "LIBSECCOMP_*",
    "MONGOCRYPT_LIB_DIR", "LIBRARY_PATH", "OPENMP_STATIC", "LIBPCAP_*",
    "WINAPI_NO_BUNDLED_LIBRARIES", "WINAPI_STATIC_NOBUNDLE", "RUST_FONTCONFIG_DLOPEN",
    "FONTCONFIG_*", "X11_*", "XEXT_*", "GL_*", "XCURSOR_*", "XXF86VM_*", "XFT_*",
    "XINERAMA_*", "XI_*", "XMU_*", "XRANDR_*", "XTST_*", "XRENDER_*", "XPRESENT_*",
    "XSCRNSAVER_*", "XT_*",
] }
