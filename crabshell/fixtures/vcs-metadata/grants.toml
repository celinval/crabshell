#:schema ../../schema/sandbox.schema.json
# Tools build-metadata libraries run, which crabshell has no built-in grants
# for. Library paths list both Fedora-style (/lib64) and Debian-style
# (/lib/x86_64-linux-gnu) locations; missing ones are skipped.

# Running git on the workspace's repository, at the workspace root above the
# members. `git status`, which dirty checks run, reads the work tree too: it
# rereads files whose index entries can't prove them unchanged, such as files
# written in the same second as the index. git fails when /etc/gitconfig
# exists but is unreadable.
[grant.git]
run = ["git"]
read = [
    ":manifest_dir/..", "/etc/gitconfig",
    "/lib64/libpcre2-8.so.0", "/lib/x86_64-linux-gnu/libpcre2-8.so.0",
    "/lib64/libz.so.1", "/lib/x86_64-linux-gnu/libz.so.1",
]

# A POSIX shell; where `sh` is bash, it links libtinfo.
[grant.sh]
run = ["sh"]
read = ["/lib64/libtinfo.so.6", "/lib/x86_64-linux-gnu/libtinfo.so.6"]

[grant.grep]
run = ["grep"]
read = ["/lib64/libpcre2-8.so.0", "/lib/x86_64-linux-gnu/libpcre2-8.so.0"]

# Where `awk` is gawk, it links these; mawk needs only libm.
[grant.awk]
run = ["awk"]
read = [
    "/lib64/libsigsegv.so.2", "/lib/x86_64-linux-gnu/libsigsegv.so.2",
    "/lib64/libreadline.so.8", "/lib/x86_64-linux-gnu/libreadline.so.8",
    "/lib64/libmpfr.so.6", "/lib/x86_64-linux-gnu/libmpfr.so.6",
    "/lib64/libgmp.so.10", "/lib/x86_64-linux-gnu/libgmp.so.10",
    "/lib64/libm.so.6", "/lib/x86_64-linux-gnu/libm.so.6",
    "/lib64/libtinfo.so.6", "/lib/x86_64-linux-gnu/libtinfo.so.6",
]
