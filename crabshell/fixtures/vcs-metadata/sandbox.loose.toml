#:schema ../../schema/sandbox.schema.json
# A loose consumer policy: the category's grant and any environment variable.
[local]
grants = ["git"]
env = ["*"]

# Running git on the workspace's repository, which crabshell has no built-in
# grant for. The repository is at the workspace root, above the member. git
# fails when /etc/gitconfig exists but is unreadable.
[grant.git]
run = ["git"]
read = [
    ":manifest_dir/../.git", "/etc/gitconfig",
    "/lib64/libpcre2-8.so.0", "/lib/x86_64-linux-gnu/libpcre2-8.so.0",
    "/lib64/libz.so.1", "/lib/x86_64-linux-gnu/libz.so.1",
]
