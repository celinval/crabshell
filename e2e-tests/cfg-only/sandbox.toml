# Minimal grants for the cfg-only fixture, attributed per package.
#
# Static glibc isn't available, so build scripts are dynamic and need the
# loader and libc.
[external]
read = ["/lib*"]

# Reads TARGET (panics without it) and CARGO_CFG_SANITIZE (silently defaults).
[package.crossbeam-utils]
env = ["TARGET", "CARGO_CFG_SANITIZE"]

[package.crossbeam-epoch]
env = ["TARGET", "CARGO_CFG_SANITIZE"]

[package.crossbeam-deque]
env = ["TARGET", "CARGO_CFG_SANITIZE"]

# Optional user override; denied, the bundled data is used.
[package.icu_properties_data]
env = ["ICU4X_DATA_DIR"]
