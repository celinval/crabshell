# Depends on a patched crossbeam-utils whose manifest declares what its build
# script needs. Patched crates sit outside CARGO_HOME, so they're `[local]`.
[workspace]

[package]
name = "declared"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
crossbeam-utils = "0.8"

[patch.crates-io]
crossbeam-utils = { path = "patches/crossbeam-utils" }
