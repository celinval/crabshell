# Depends on crates whose build scripts run `$RUSTC` to detect its version or
# probe for compiler features.
[workspace]

[package]
name = "rustc-probe"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
getrandom = "0.3"
libc = "0.2"
nix = "0.30"
parking_lot_core = "0.9"
proc-macro2 = "1"
rustix = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
