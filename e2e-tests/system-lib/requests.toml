# What each crate's build script would request, precisely, from the vendor's
# point of view: only what its own code uses, with no knowledge of the host.
# Test-only: crabshell reads it through CRABSHELL_REQUESTS (feature
# `test-requests`) in place of the crates' `[package.metadata.build-rs]`.
# Every build script in the fixture is listed; a crate that reads its own
# files requests its crate root, which is otherwise narrowed away. Tools come
# from named grants
# (`rustc`, `pkg-config`, `cc`); a crate lists the knobs it reads itself,
# including the pkg-config crate's per-library `<LIB>_NO_PKG_CONFIG`,
# `<LIB>_STATIC` and `<LIB>_DYNAMIC`.

[package.libc]
requests = ["rustc"]
env = [
    "CARGO_CFG_LIBC_UNSTABLE_FREEBSD_VERSION", "CARGO_CFG_LIBC_UNSTABLE_GNU_FILE_OFFSET_BITS",
    "CARGO_CFG_LIBC_UNSTABLE_GNU_TIME_BITS", "CARGO_CFG_LIBC_UNSTABLE_MUSL_V1_2",
    "CARGO_CFG_LIBC_UNSTABLE_MUSL_V1_2_3", "CARGO_CFG_LIBC_UNSTABLE_TIME64",
    "CARGO_CFG_LIBC_UNSTABLE_UCLIBC_TIME64",
    "CARGO_CFG_TARGET_ABI", "CARGO_CFG_TARGET_ARCH", "CARGO_CFG_TARGET_ENV",
    "CARGO_CFG_TARGET_OS", "CARGO_CFG_TARGET_POINTER_WIDTH",
    "CARGO_FEATURE_RUSTC_DEP_OF_STD", "LIBC_BUILD_VERBOSE", "LIBC_CI",
    "RUST_LIBC_UNSTABLE_FREEBSD_VERSION", "RUST_LIBC_UNSTABLE_GNU_FILE_OFFSET_BITS",
    "RUST_LIBC_UNSTABLE_GNU_TIME_BITS", "RUST_LIBC_UNSTABLE_MUSL_V1_2_3", "WIND_RELEASE_ID",
]

[package.libsqlite3-sys]
# Reads its own crate: copies bundled bindings; builds the vendored sqlite3
# when bundled. Subpaths need containment-based paths.
read = [":manifest_dir"]
requests = ["pkg-config"]
env = [
    "CARGO_CFG_TARGET_ENV", "CARGO_CFG_TARGET_OS", "CARGO_CFG_WINDOWS", "DEP_OPENSSL_INCLUDE",
    "HOST", "TARGET", "LIBSQLITE3_FLAGS", "LIBSQLITE3_SYS_BUNDLING", "LIBSQLITE3_SYS_USE_PKG_CONFIG",
    "SQLITE_MAX_COLUMN", "SQLITE_MAX_EXPR_DEPTH", "SQLITE_MAX_VARIABLE_NUMBER",
    "SQLITE3_INCLUDE_DIR", "SQLITE3_LIB_DIR", "SQLITE3_STATIC",
    "SQLITE3_NO_PKG_CONFIG", "SQLITE3_DYNAMIC",
]

[package.libz-sys]
# Reads its own crate: compiles its `src/smoke.c` check, and the vendored zlib
# as a fallback. Subpaths need containment-based paths.
read = [":manifest_dir"]
requests = ["pkg-config", "cc"]
env = [
    "CARGO_CFG_TARGET_ARCH", "CARGO_CFG_TARGET_FEATURE", "HOST", "TARGET",
    "ZLIB_NO_PKG_CONFIG", "ZLIB_STATIC", "ZLIB_DYNAMIC",
]

[package.lzma-sys]
# Reads its own crate: builds the vendored xz unless pkg-config finds one.
# Subpaths need containment-based paths.
read = [":manifest_dir"]
requests = ["pkg-config", "cc"]
env = [
    "CARGO_CFG_TARGET_ENDIAN", "LZMA_API_STATIC", "TARGET",
    "LIBLZMA_NO_PKG_CONFIG", "LIBLZMA_STATIC", "LIBLZMA_DYNAMIC",
]

# openssl-sys also reads each knob prefixed with the target triple
# (`X86_64_UNKNOWN_LINUX_GNU_OPENSSL_DIR`). A vendor can't name the triple in
# advance, and patterns only match prefixes, so it's listed for this host.
[package.openssl-sys]
# Reads its own crate: expands its `build/expando.c`. Subpaths need
# containment-based paths.
read = [":manifest_dir"]
requests = ["pkg-config", "cc"]
env = [
    "CARGO_CFG_TARGET_OS", "CARGO_CFG_TARGET_POINTER_WIDTH", "CARGO_CFG_UNIX", "DEP_BSSL_CONF",
    "HOST", "TARGET",
    "OPENSSL_CONFIG_DIR", "OPENSSL_DIR", "OPENSSL_INCLUDE_DIR", "OPENSSL_LIBS",
    "OPENSSL_LIB_DIR", "OPENSSL_NO_VENDOR", "OPENSSL_STATIC",
    "OPENSSL_NO_PKG_CONFIG", "OPENSSL_DYNAMIC",
    "X86_64_UNKNOWN_LINUX_GNU_OPENSSL_CONFIG_DIR", "X86_64_UNKNOWN_LINUX_GNU_OPENSSL_DIR",
    "X86_64_UNKNOWN_LINUX_GNU_OPENSSL_INCLUDE_DIR", "X86_64_UNKNOWN_LINUX_GNU_OPENSSL_LIBS",
    "X86_64_UNKNOWN_LINUX_GNU_OPENSSL_LIB_DIR", "X86_64_UNKNOWN_LINUX_GNU_OPENSSL_NO_VENDOR",
    "X86_64_UNKNOWN_LINUX_GNU_OPENSSL_STATIC",
]

[package.zstd-sys]
# Reads its own crate: builds the vendored zstd unless pkg-config finds one.
# Subpaths need containment-based paths.
read = [":manifest_dir"]
requests = ["pkg-config", "cc"]
env = [
    "CARGO_CFG_TARGET_ARCH", "CARGO_CFG_TARGET_ENV", "CARGO_CFG_TARGET_OS", "CARGO_CFG_WINDOWS",
    "CARGO_MANIFEST_DIR", "TARGET", "ZSTD_SYS_NO_HIDE_SYMBOLS", "ZSTD_SYS_USE_PKG_CONFIG",
    "LIBZSTD_NO_PKG_CONFIG", "LIBZSTD_STATIC", "LIBZSTD_DYNAMIC",
]
