# A candidate `system-lib` bundle in `[external]`: the `rustc-probe` bundle,
# plus pkg-config (here, a chain of shell wrappers ending in pkgconf) and the
# C toolchain the cc crate drives to probe and link test programs.
# Library-location knobs (OPENSSL_DIR, ZLIB_STATIC, ...) are left out: they
# are user input, and denying them silently selects the defaults.
[external]
read = [
    "/lib*", "$RUSTUP_HOME/toolchains",
    "/usr/lib64/pkgconfig", "/usr/share/pkgconfig", "/usr/include", "/usr/libexec/gcc",
]
run = ["pkg-config", "sh", "rpm", "x86_64-amazon-linux-gnu-pkg-config", "pkgconf", "cc", "as", "ld"]
env = [
    "TARGET", "HOST", "PROFILE", "OPT_LEVEL", "DEBUG", "NUM_JOBS",
    "CARGO_CFG_*", "CARGO_FEATURE_*", "CARGO_PKG_*", "CARGO_MANIFEST_*", "DEP_*",
    "RUSTC", "RUSTC_WRAPPER", "RUSTC_WORKSPACE_WRAPPER", "RUSTC_LINKER", "CARGO_ENCODED_RUSTFLAGS",
    "PKG_CONFIG*", "HOST_PKG_CONFIG*", "CC*", "CFLAGS*", "HOST_CC", "HOST_CFLAGS",
    "CRATE_CC_NO_DEFAULTS", "SOURCE_DATE_EPOCH", "PATH",
]
