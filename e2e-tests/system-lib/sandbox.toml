# Minimal grants for the system-lib fixture, attributed per package.
[external]
read = ["/lib*", "$RUSTUP_HOME/toolchains"]

# Transitive; see e2e-tests/rustc-probe.
[package.libc]
env = [
    "RUSTC", "RUSTC_WRAPPER", "CARGO_CFG_*", "CARGO_FEATURE_RUSTC_DEP_OF_STD",
    "RUST_LIBC_UNSTABLE_*", "WIND_RELEASE_ID",
]

# On Amazon Linux, `pkg-config` is a shell wrapper that runs `rpm --eval` to
# find the platform, then a second wrapper that execs `pkgconf`. pkgconf reads
# the .pc search path.
[package.zstd-sys]
read = { inherit = true, value = ["/usr/lib64/pkgconfig", "/usr/share/pkgconfig"] }
run = ["pkg-config", "sh", "rpm", "x86_64-amazon-linux-gnu-pkg-config", "pkgconf"]
env = ["TARGET", "HOST", "CARGO_CFG_*", "PKG_CONFIG*", "ZSTD_SYS_*", "LIBZSTD_*"]

[package.lzma-sys]
read = { inherit = true, value = ["/usr/lib64/pkgconfig", "/usr/share/pkgconfig"] }
run = ["pkg-config", "sh", "rpm", "x86_64-amazon-linux-gnu-pkg-config", "pkgconf"]
env = ["TARGET", "HOST", "CARGO_CFG_*", "PKG_CONFIG*", "LZMA_API_STATIC", "LIBLZMA_*"]

[package.libsqlite3-sys]
read = { inherit = true, value = ["/usr/lib64/pkgconfig", "/usr/share/pkgconfig"] }
run = ["pkg-config", "sh", "rpm", "x86_64-amazon-linux-gnu-pkg-config", "pkgconf"]
env = ["TARGET", "HOST", "CARGO_CFG_*", "PKG_CONFIG*", "SQLITE*", "SQLITE3_*"]

# Also drives the cc crate, so it needs the C compiler: the driver, cc1
# under /usr/libexec/gcc, and the system headers.
[package.libz-sys]
read = { inherit = true, value = [
    "/usr/lib64/pkgconfig", "/usr/share/pkgconfig", "/usr/include", "/usr/libexec/gcc",
] }
run = ["pkg-config", "sh", "rpm", "x86_64-amazon-linux-gnu-pkg-config", "pkgconf", "cc", "as", "ld"]
env = [
    "TARGET", "HOST", "CARGO_CFG_*", "PKG_CONFIG*", "ZLIB_*", "LIBZ_SYS_*",
    # cc crate: Cargo's profile inputs and the compiler's own env.
    "OPT_LEVEL", "DEBUG", "PROFILE", "NUM_JOBS", "CARGO_ENCODED_RUSTFLAGS",
    "CC*", "CFLAGS*", "HOST_*", "CRATE_CC_NO_DEFAULTS", "SOURCE_DATE_EPOCH",
    "CPATH", "C_INCLUDE_PATH", "COMPILER_PATH", "GCC_EXEC_PREFIX", "SYSROOT",
    # gcc finds cc1 relative to its own location, found through PATH.
    "PATH",
]

# Also drives the cc crate, so it needs the C compiler: the driver, cc1
# under /usr/libexec/gcc, and the system headers.
[package.openssl-sys]
read = { inherit = true, value = [
    "/usr/lib64/pkgconfig", "/usr/share/pkgconfig", "/usr/include", "/usr/libexec/gcc",
] }
run = ["pkg-config", "sh", "rpm", "x86_64-amazon-linux-gnu-pkg-config", "pkgconf", "cc", "as", "ld"]
env = [
    "TARGET", "HOST", "CARGO_CFG_*", "PKG_CONFIG*", "OPENSSL_*", "X86_64_UNKNOWN_LINUX_GNU_OPENSSL_*",
    # cc crate: Cargo's profile inputs and the compiler's own env.
    "OPT_LEVEL", "DEBUG", "PROFILE", "NUM_JOBS", "CARGO_ENCODED_RUSTFLAGS",
    "CC*", "CFLAGS*", "HOST_*", "CRATE_CC_NO_DEFAULTS", "SOURCE_DATE_EPOCH",
    "CPATH", "C_INCLUDE_PATH", "COMPILER_PATH", "GCC_EXEC_PREFIX", "SYSROOT",
    # gcc finds cc1 relative to its own location, found through PATH.
    "PATH",
]
